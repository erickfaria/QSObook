name: CI

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CGO_ENABLED: '0'
  GOTELEMETRY: 'off'
  GOTOOLCHAIN: local

jobs:
  validate:
    name: Validate (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache-dependency-path: go.sum

      - name: Set up Node.js for dependency-free browser regressions
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Check Go formatting
        shell: bash
        run: |
          unformatted="$(git ls-files -z '*.go' | xargs -0 gofmt -l)"
          if [ -n "$unformatted" ]; then
            printf 'Run gofmt on:\n%s\n' "$unformatted"
            exit 1
          fi

      - name: Verify Go modules
        run: |
          go mod download
          go mod verify

      - name: Run Go tests
        run: go test -mod=readonly -count=1 ./...

      - name: Run Go vet
        run: go vet -mod=readonly ./...

      - name: Check reachable Go vulnerabilities
        if: matrix.arch == 'amd64'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: Check JavaScript and run regressions
        run: |
          node --check static/app.js
          node --check static/theme.js
          node --check static/map.js
          node --check static/locale.js
          node --test tests/*.test.cjs

      - name: Build native executable
        run: go build -mod=readonly -trimpath -o bin/qsobook-linux-${{ matrix.arch }} .

      - name: Build container and verify persistent local deployment
        run: |
          docker compose config --quiet
          image="qsobook-ci:$GITHUB_SHA"
          docker build --tag "$image" .
          QSOBOOK_IMAGE="$image" QSOBOOK_COMPOSE_FILE=compose.release.yaml python3 tests/container_smoke.py
          QSOBOOK_IMAGE="$image" QSOBOOK_COMPOSE_FILE=compose.lan.yaml python3 tests/container_smoke.py

      - name: Check source remains unchanged
        run: |
          git diff --check
          git diff --exit-code
