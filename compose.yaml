name: qsobook
services:
  qsobook:
    build: .
    ports:
      - "127.0.0.1:${QSOBOOK_PORT:-8080}:8080"
    volumes:
      - data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 10s
volumes:
  data:
